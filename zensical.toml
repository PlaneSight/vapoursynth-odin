[project]
site_name = "VapourSynth bindings for Odin"
site_description = "Odin bindings for VapourSynth core API 4.2 and VSScript API 4.2: declarations, ownership, ABI compatibility, and usage examples."
docs_dir = "docs/content"
site_dir = ".venv/site"
extra_css = ["assets/stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Installation" = "getting-started/installation.md" },
    { "First program" = "getting-started/quickstart.md" },
    { "Choose an interface" = "getting-started/choosing-an-interface.md" },
  ] },
  { "Guides" = [
    { "Ownership and lifetime" = "guides/ownership.md" },
    { "Errors and diagnostics" = "guides/errors.md" },
    { "Maps and properties" = "guides/maps.md" },
    { "Frames and pixel layout" = "guides/frames.md" },
    { "Loading and linking" = "guides/loading-and-linking.md" },
    { "Python tooling and example packaging" = "guides/python-packaging.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "Idiomatic interface" = "reference/easy.md" },
    { "Raw core API" = "reference/raw-api.md" },
    { "Types and constants" = "reference/types-and-constants.md" },
    { "VSScript API" = "reference/vsscript.md" },
  ] },
  { "Binding examples" = [
    "examples/index.md",
    { "Build and preview" = "guides/previewing-examples.md" },
    { "1 · Core information" = "examples/core-info.md" },
    { "2 · Typed properties" = "examples/properties.md" },
    { "3 · Read a frame" = "examples/easy-host.md" },
    { "4 · Use the raw API" = "examples/raw-host.md" },
    { "5 · Identity plugin" = "examples/identity-plugin.md" },
    { "6 · Frame callbacks" = "examples/invert-plugin.md" },
    { "7 · Output formats" = "examples/dither-plugin.md" },
    { "8 · Native library resources" = "examples/haldlut-plugin.md" },
  ] },
  { "Project" = [
    { "Testing and verification" = "maintenance/testing.md" },
    { "Compatibility and upgrades" = "maintenance/compatibility.md" },
    { "Build and publish these docs" = "maintenance/documentation.md" },
    { "Troubleshooting" = "troubleshooting.md" },
    { "Header provenance" = "license.md" },
  ] },
]

[project.theme]
custom_dir = "docs/overrides"
language = "en"
font = false
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true

[project.validation.nav]
not_found = "warn"
omitted_files = "warn"

[project.validation.links]
not_found = "warn"
unrecognized_links = "warn"
anchors = "warn"
