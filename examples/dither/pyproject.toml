[project]
name = "vapoursynth-odin-dither"
version = "0.1.0"
description = "Standalone Odin VapourSynth dither plugin"
readme = "README.md"
requires-python = ">=3.14"
license = "LGPL-2.1-or-later"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
dependencies = ["vapoursynth>=76,<80", "numpy>=2.5,<3"]

[tool.uv]
package = false

[tool.odin]
name = "dither"
kind = "plugin"
stb = false

[tool.odin.bindings]
repository = "PlaneSight/vapoursynth-odin"
revision = "e2e850dac151b63f3856665f42943f1fb4bfdd11"
sha256 = "bf290f75df999b5336024c63a62af6857fff2b686ccd0b77b6a3d05fcc45061f"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[dependency-groups]
preview = ["vsview==0.11.0"]

[tool.uv.dependency-groups]
preview = { requires-python = ">=3.14,<3.15" }

[tool.hatch.build.targets.sdist]
include = ["/src/", "/*.py", "/preview.vpy", "/pyproject.toml", "/uv.lock", "/.python-version", "/.gitignore", "/README.md", "/LICENSE", "/THIRD_PARTY_LICENSES.md"]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
