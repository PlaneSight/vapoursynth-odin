name: Documentation

on:
  push:
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'zensical.toml'
      - 'requirements-docs.txt'
      - 'tools/**'
      - '*.odin'
      - 'easy/**'
      - 'examples/**'
      - 'vsscript/**'
      - 'link/**'
      - 'tests/**'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build and validate documentation
        run: |
          python -m zensical build --clean --strict
          python tools/check_docs.py
          python -m unittest discover -s tests -p test_check_docs.py
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: site
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v6
        id: pages
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Configure the repository and Pages URLs
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python tools/pages_config.py
      - name: Build and validate the Pages site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python -m zensical build --clean --strict --config-file .zensical-pages.toml
          python tools/check_docs.py --base-path "$PAGES_BASE_PATH"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
