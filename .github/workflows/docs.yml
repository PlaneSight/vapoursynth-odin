name: Documentation

on:
  push:
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'zensical.toml'
      - '.python-version'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'hatch_build.py'
      - 'THIRD_PARTY_LICENSES.md'
      - 'tools/**'
      - '*.odin'
      - 'easy/**'
      - 'examples/**'
      - 'plugins/**'
      - 'vsscript/**'
      - 'link/**'
      - 'tests/**'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
      - name: Install uv
        run: python -m pip install uv==0.12.0
      - name: Install locked documentation environment
        run: uv sync --locked --group docs
      - name: Install the verified Odin toolchain
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'odin.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'odin'
          Invoke-WebRequest -Uri 'https://github.com/odin-lang/Odin/releases/download/dev-2026-09/odin-windows-amd64-dev-2026-09.zip' -OutFile $archive
          $expected = '8ed8abd95b82e0af1eb7e86cb75f380fd8bde104947721817b35929f5fc19388'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Odin archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $executables = @(Get-ChildItem -LiteralPath $destination -Recurse -File -Filter odin.exe)
          if ($executables.Count -ne 1) { throw 'Expected one Odin compiler in the archive' }
          $executables[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Compile examples, render documentation images, and build the site
        run: uv run --locked --group docs tools/docs.py build
      - name: Verify command and rendering failure boundaries
        run: |
          uv run --locked --group docs python -m unittest discover -s tests -p 'test_*.py'
      - name: Check every preview output
        run: uv run --locked tools/examples.py check --no-build
      - name: Check DitherPlus modes against independent pixel oracles
        run: uv run --locked tests/dither_plus.py --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: example-images
          path: docs/assets/generated
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: .venv/site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
      - uses: actions/configure-pages@v6
        id: pages
      - name: Install uv
        run: python -m pip install uv==0.12.0
      - name: Install locked documentation environment
        run: uv sync --locked --only-group docs
      - uses: actions/download-artifact@v4
        with:
          name: example-images
          path: docs/assets/generated
      - name: Configure the repository and Pages URLs
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: uv run --locked --only-group docs tools/pages_config.py
      - name: Build and validate the Pages site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          uv run --locked --only-group docs zensical build --clean --strict --config-file .zensical-pages.toml
          uv run --locked --only-group docs tools/check_docs.py --base-path "$PAGES_BASE_PATH"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .venv/site
      - uses: actions/deploy-pages@v5
        id: deployment
