[project]
name = "vapoursynth-odin"
version = "0.1.0"
description = "Development tooling for Odin bindings to VapourSynth API 4.2"
readme = "README.md"
requires-python = ">=3.14"
license = "LGPL-2.1-or-later"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
dependencies = ["vapoursynth>=76,<80"]

[dependency-groups]
dev = ["numpy>=2.5,<3"]
docs = ["zensical==0.0.59", "tomli-w==1.2.0", "numpy>=2.5,<3", "vapoursynth>=76,<80"]
preview = ["vsview==0.11.0"]

[tool.uv]
package = false

[tool.uv.dependency-groups]
preview = { requires-python = ">=3.14,<3.15" }
