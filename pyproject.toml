[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "vapoursynth-odin-examples"
version = "0.1.0"
description = "Native VapourSynth API 4.2 example filters written in Odin"
readme = "README.md"
requires-python = ">=3.12"
license = "LGPL-2.1-or-later"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
dependencies = ["vapoursynth>=76,<80"]

[dependency-groups]
dev = ["hatchling==1.32.0", "numpy>=2.5,<3", "packaging>=26,<27"]
docs = ["zensical==0.0.59", "tomli-w==1.2.0", "numpy>=2.5,<3", "vapoursynth>=76,<80"]
preview = ["vsview==0.11.0"]

[tool.uv]
package = false

[tool.uv.dependency-groups]
preview = { requires-python = ">=3.12,<3.15" }

[tool.hatch.build.targets.sdist]
include = [
  "/*.odin",
  "/easy/",
  "/link/",
  "/vsscript/",
  "/examples/",
  "/tests/test_packaging.py",
  "/tools/packagecheck.py",
  "/hatch_build.py",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
  "/THIRD_PARTY_LICENSES.md",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
